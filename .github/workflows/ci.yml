name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        pandas: ["pandas>=2,<3", "pandas>=3"]   # v1 silently broke on pandas 3
        exclude:
          - python-version: "3.10"   # pandas 3 requires Python 3.11+
            pandas: "pandas>=3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]" "${{ matrix.pandas }}"
      - run: ruff check . && ruff format --check .
      - run: pytest -q --cov=hindi_translator --cov-report=term-missing

  integration:
    # Real MarianMT model on the bundled CSV (CPU). Slower, so it runs after unit tests.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-hi-en
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[marian,dev]"
      - run: RUN_MARIAN=1 pytest -q tests/test_integration.py
      - run: hindi-translate --backend marian --keep-original --output translated_hindi.csv
      - run: cat translated_hindi.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: translated-sample
          path: translated_hindi.csv
